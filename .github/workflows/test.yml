name: SimbioReader Test

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --all-groups --locked
    - name: Lint with Ruff
      run: uv run ruff check src test
    - name: Test with pytest
      run: uv run pytest
