# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: SimbioReader Test

on:
  push:
    branches: ["main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        sudo apt install -y gcc cmake libboost-all-dev
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov
        pip install -e .
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check src test --select=E9,F63,F7,F82 --output-format=full
        # exit-zero treats all other findings as warnings
        ruff check src test --exit-zero
    - name: Test with pytest
      run: |
        pytest
