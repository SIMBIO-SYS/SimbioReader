[project]
name = "SimbioReader"
version = "1.0.0-dev.2"
description = "Python Reader for the data from SIMBIO-SYS instrument suite on-board the ESA mission BepiColombo"
dependencies = [
    "numpy>=2.3.3,<3.0.0",
    "rich-click>=1.8.9,<2.0.0",
    "importlib-metadata>=8.7.0,<9.0.0",
    "pillow>=12.0.0,<13.0.0",
    "packaging>=26.0,<27.0",
    "requests>=2.32.5,<3.0.0",
    "semantic-version-tools>=1.4.1,<2.0.0",
    "loguru>=0.7.3",
    "pds4-tools>=1.4",
    "lxml>=6.1.1",
]
requires-python = ">=3.14,<4.0"
authors = [{ name = "Romolo Politi", email = "Romolo.Politi@inaf.it" }]
readme = "README.md"
license-files = ["LICENSE"]
keywords = ["data reader", "Space Mission", "BepiColombo", "SIMBIO-SYS"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
]

[project.urls]
Repository = "https://github.com/SIMBIO-SYS/SimbioReader"

[project.scripts]
simbioReader = "SimbioReader.cli:cli"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "SimbioReader"

[dependency-groups]
docs = [
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
markers = [
    "caldb: mark a test as a caldb test",
    "config: mark a test as a config test",
    "pipeline: mark a test as a pipeline test",
    "pipeline_L0: mark a test as a pipeline L0 test",
    "pipeline_step: mark a test as a pipeline step test"
]
addopts = [
    "--basetemp=/tmp/pytest",
    "--verbosity=3", 
    "--tb=line", 
    "--capture=sys", 
    "--show-capture=all",
    "--cov=SimbioReader",
    "--cov-report=term",
    "--cov-report=html:coverage/coverage_html",
    "--cov-report=xml:coverage/coverage.xml", 
    "--cov-report=json:coverage/coverage.json"

   
]
testpaths=[
    "tests/"
]
log_file = "output/log/pytest_log.log"
log_file_level = "DEBUG"

log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

log_file_date_format = "%Y-%m-%d %H:%M:%S"
pythonpath = ["."]

[tool.coverage.run]
branch=true
omit=["test/*","./prova.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["src"]
